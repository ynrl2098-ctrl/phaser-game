<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER-WING: ZERO HOUR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #00f0ff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-wrapper {
      position: relative;
      border: 2px solid #00f0ff;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.4), inset 0 0 15px rgba(0, 240, 255, 0.2);
    }
    canvas { display: block; background: #020208; }
    .scanline {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 4px; pointer-events: none; opacity: 0.6;
    }
  </style>
</head>
<body>

<div id="game-wrapper">
  <canvas id="viewport" width="500" height="700"></canvas>
  <div class="scanline"></div>
</div>

<script>
// --- WEB AUDIO SYNTHESIZER ---
const AudioFX = {
  ctx: null,
  init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
  play(type) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain); gain.connect(this.ctx.destination);

    if (type === 'laser') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'hit') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.linearRampToValueAtTime(40, now + 0.08);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.08);
      osc.start(now); osc.stop(now + 0.08);
    } else if (type === 'exp') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(100, now);
      osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'powerup') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(900, now + 0.2);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.2);
      osc.start(now); osc.stop(now + 0.2);
    }
  }
};

// --- CORE ENGINE VARIABLES ---
const canvas = document.getElementById('viewport');
const ctx = canvas.getContext('2d');

let gameState = 'START'; // START, PLAYING, PAUSED, GAMEOVER
let score = 0, wave = 1, shakeTime = 0;
const keys = {};

window.addEventListener('keydown', e => {
  AudioFX.init();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === 'KeyP' && (gameState === 'PLAYING' || gameState === 'PAUSED')) {
    gameState = gameState === 'PLAYING' ? 'PAUSED' : 'PLAYING';
  }
  if ((e.code === 'Space' || e.code === 'Enter') && (gameState === 'START' || gameState === 'GAMEOVER')) {
    resetGame();
    gameState = 'PLAYING';
  }
});
window.addEventListener('keyup', e => keys[e.code] = false);

// --- PARTICLE & SHAKE SYSTEM ---
class Particle {
  constructor(x, y, color, speedMult = 1) {
    this.x = x; this.y = y;
    const a = Math.random() * Math.PI * 2;
    const s = (Math.random() * 4 + 1) * speedMult;
    this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s;
    this.size = Math.random() * 3 + 1;
    this.color = color; this.alpha = 1;
    this.decay = Math.random() * 0.03 + 0.015;
  }
  update() { this.x += this.vx; this.y += this.vy; this.alpha -= this.decay; }
  draw(ctx) {
    ctx.save(); ctx.globalAlpha = Math.max(0, this.alpha);
    ctx.fillStyle = this.color; ctx.fillRect(this.x, this.y, this.size, this.size);
    ctx.restore();
  }
}

let particles = [];
function addExplosion(x, y, color, count = 15, speed = 1) {
  for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color, speed));
}

// --- BACKGROUND PARALLAX ---
const stars = Array.from({ length: 80 }, () => ({
  x: Math.random() * canvas.width, y: Math.random() * canvas.height,
  s: Math.random() * 2 + 0.5, speed: Math.random() * 3 + 0.5
}));

// --- GAME ENTITIES ---
class Player {
  constructor() {
    this.x = canvas.width / 2; this.y = canvas.height - 80;
    this.speed = 5.5; this.radius = 16;
    this.hp = 100; this.maxHp = 100;
    this.weaponTier = 1; this.coolDown = 0;
  }
  update() {
    if (keys['ArrowLeft'] || keys['KeyA']) this.x -= this.speed;
    if (keys['ArrowRight'] || keys['KeyD']) this.x += this.speed;
    if (keys['ArrowUp'] || keys['KeyW']) this.y -= this.speed;
    if (keys['ArrowDown'] || keys['KeyS']) this.y += this.speed;

    this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
    this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));

    // Engine exhaust
    particles.push(new Particle(this.x + (Math.random() * 6 - 3), this.y + 16, '#00f0ff', 0.5));

    if (this.coolDown > 0) this.coolDown--;
    if ((keys['Space'] || keys['KeyK']) && this.coolDown === 0) {
      this.shoot();
      this.coolDown = 9;
    }
  }
  shoot() {
    AudioFX.play('laser');
    if (this.weaponTier === 1) {
      playerBullets.push(new Bullet(this.x, this.y - 18, 0, -12, '#00f0ff'));
    } else if (this.weaponTier === 2) {
      playerBullets.push(new Bullet(this.x - 10, this.y - 10, 0, -12, '#00f0ff'));
      playerBullets.push(new Bullet(this.x + 10, this.y - 10, 0, -12, '#00f0ff'));
    } else {
      playerBullets.push(new Bullet(this.x, this.y - 18, 0, -12, '#00f0ff'));
      playerBullets.push(new Bullet(this.x - 12, me => me.y - 5, -2.5, -11, '#ff00ff'));
      playerBullets.push(new Bullet(this.x + 12, me => me.y - 5, 2.5, -11, '#ff00ff'));
    }
  }
  draw(ctx) {
    ctx.save(); ctx.translate(this.x, this.y);
    ctx.strokeStyle = '#00f0ff'; ctx.fillStyle = '#021020'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -20); ctx.lineTo(16, 16); ctx.lineTo(8, 8); ctx.lineTo(-8, 8); ctx.lineTo(-16, 16);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}

class Bullet {
  constructor(x, y, vx, vy, color, isEnemy = false) {
    this.x = x; this.y = typeof y === 'function' ? y(this) : y;
    this.vx = vx; this.vy = vy; this.color = color;
    this.isEnemy = isEnemy; this.radius = 3; this.dead = false;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    if (this.y < -20 || this.y > canvas.height + 20 || this.x < -20 || this.x > canvas.width + 20) this.dead = true;
  }
  draw(ctx) {
    ctx.save(); ctx.fillStyle = this.color;
    ctx.shadowColor = this.color; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

class Enemy {
  constructor(type = 1) {
    this.type = type; this.dead = false;
    this.x = Math.random() * (canvas.width - 60) + 30; this.y = -30;
    this.t = 0;

    if (type === 1) { // Scout
      this.hp = 2; this.speed = 3; this.radius = 12; this.color = '#ff0055';
    } else if (type === 2) { // Interceptor
      this.hp = 5; this.speed = 1.8; this.radius = 18; this.color = '#ff9900';
    } else if (type === 3) { // BOSS
      this.x = canvas.width / 2; this.y = -80;
      this.hp = 120 + wave * 30; this.maxHp = this.hp;
      this.speed = 1; this.radius = 45; this.color = '#ff0000';
    }
  }
  update() {
    this.t += 0.03;
    if (this.type === 1) {
      this.y += this.speed;
    } else if (this.type === 2) {
      this.y += this.speed; this.x += Math.sin(this.t) * 2.5;
      if (Math.random() < 0.015) {
        enemyBullets.push(new Bullet(this.x, this.y + 15, 0, 5, '#ff9900', true));
      }
    } else if (this.type === 3) { // Boss movement and attack patterns
      if (this.y < 100) this.y += 1;
      else this.x = canvas.width / 2 + Math.sin(this.t * 0.8) * 150;

      if (Math.random() < 0.05) {
        const a = Math.atan2(player.y - this.y, player.x - this.x);
        enemyBullets.push(new Bullet(this.x, this.y + 20, Math.cos(a) * 4.5, Math.sin(a) * 4.5, '#ff0055', true));
      }
    }
    if (this.y > canvas.height + 40) this.dead = true;
  }
  draw(ctx) {
    ctx.save(); ctx.translate(this.x, this.y);
    ctx.strokeStyle = this.color; ctx.fillStyle = '#100005'; ctx.lineWidth = 2;
    ctx.beginPath();
    if (this.type === 1) {
      ctx.moveTo(0, 14); ctx.lineTo(-12, -10); ctx.lineTo(12, -10);
    } else if (this.type === 2) {
      ctx.moveTo(0, 18); ctx.lineTo(-18, -4); ctx.lineTo(-8, -16); ctx.lineTo(8, -16); ctx.lineTo(18, -4);
    } else if (this.type === 3) { // Boss design
      ctx.lineWidth = 3;
      ctx.moveTo(0, 45); ctx.lineTo(-40, -10); ctx.lineTo(-20, -40); ctx.lineTo(20, -40); ctx.lineTo(40, -10);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}

class PowerUp {
  constructor(x, y) {
    this.x = x; this.y = y; this.radius = 10; this.dead = false;
  }
  update() { this.y += 1.5; if (this.y > canvas.height + 20) this.dead = true; }
  draw(ctx) {
    ctx.save(); ctx.fillStyle = '#00ffcc'; ctx.shadowColor = '#00ffcc'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('P', this.x, this.y); ctx.restore();
  }
}

// --- GLOBAL GAME STATE CONTAINERS ---
let player, playerBullets, enemyBullets, enemies, powerUps;

function resetGame() {
  score = 0; wave = 1; shakeTime = 0;
  player = new Player();
  playerBullets = []; enemyBullets = []; enemies = []; powerUps = []; particles = [];
}

let spawnTimer = 0;
function spawnLogic() {
  spawnTimer++;
  const activeBoss = enemies.some(e => e.type === 3);

  if (!activeBoss && spawnTimer > Math.max(15, 50 - wave * 3)) {
    spawnTimer = 0;
    if (score > 0 && score % 600 < 50 && !enemies.some(e => e.type === 3)) {
      enemies.push(new Enemy(3)); // Spawn Boss
    } else {
      enemies.push(new Enemy(Math.random() < 0.7 ? 1 : 2));
    }
  }
}

function resolveCollisions() {
  // Player bullets vs Enemies
  playerBullets.forEach(b => {
    enemies.forEach(e => {
      if (!b.dead && !e.dead && Math.hypot(b.x - e.x, b.y - e.y) < b.radius + e.radius) {
        b.dead = true; e.hp--;
        AudioFX.play('hit');
        addExplosion(b.x, b.y, b.color, 4);

        if (e.hp <= 0) {
          e.dead = true;
          AudioFX.play('exp');
          shakeTime = e.type === 3 ? 20 : 6;
          addExplosion(e.x, e.y, e.color, e.type === 3 ? 50 : 15, e.type === 3 ? 2 : 1);
          score += e.type === 3 ? 500 : e.type * 30;
          if (e.type === 3) wave++;
          if (Math.random() < 0.25) powerUps.push(new PowerUp(e.x, e.y));
        }
      }
    });
  });

  // Enemy bullets vs Player
  enemyBullets.forEach(b => {
    if (!b.dead && Math.hypot(b.x - player.x, b.y - player.y) < b.radius + player.radius) {
      b.dead = true; player.hp -= 12;
      shakeTime = 8; AudioFX.play('hit');
      addExplosion(player.x, player.y, '#ff0055', 10);
      if (player.hp <= 0) gameOver();
    }
  });

  // Enemies vs Player
  enemies.forEach(e => {
    if (!e.dead && Math.hypot(e.x - player.x, e.y - player.y) < e.radius + player.radius) {
      if (e.type !== 3) e.dead = true;
      player.hp -= 25; shakeTime = 12; AudioFX.play('exp');
      addExplosion(e.x, e.y, '#ff0055', 20);
      if (player.hp <= 0) gameOver();
    }
  });

  // Powerups vs Player
  powerUps.forEach(p => {
    if (!p.dead && Math.hypot(p.x - player.x, p.y - player.y) < p.radius + player.radius) {
      p.dead = true; AudioFX.play('powerup');
      player.weaponTier = Math.min(3, player.weaponTier + 1);
      player.hp = Math.min(player.maxHp, player.hp + 20);
      addExplosion(player.x, player.y, '#00ffcc', 10);
    }
  });
}

function gameOver() {
  gameState = 'GAMEOVER'; shakeTime = 25; AudioFX.play('exp');
  addExplosion(player.x, player.y, '#00f0ff', 40, 2);
}

// --- RENDER HUD & OVERLAYS ---
function renderHUD() {
  ctx.fillStyle = '#00f0ff'; ctx.font = '14px monospace'; ctx.textAlign = 'left';
  ctx.fillText(`SCORE: ${score.toString().padStart(6, '0')}`, 15, 25);
  ctx.fillText(`WAVE:  ${wave}`, 15, 45);

  // HP Bar
  ctx.strokeStyle = '#00f0ff'; ctx.strokeRect(canvas.width - 135, 15, 120, 12);
  ctx.fillStyle = player.hp > 30 ? '#00f0ff' : '#ff0055';
  ctx.fillRect(canvas.width - 134, 16, (Math.max(0, player.hp) / player.maxHp) * 118, 10);

  // Boss HP Bar (if active)
  const boss = enemies.find(e => e.type === 3);
  if (boss) {
    ctx.strokeStyle = '#ff0055'; ctx.strokeRect(canvas.width / 2 - 100, 50, 200, 8);
    ctx.fillStyle = '#ff0055'; ctx.fillRect(canvas.width / 2 - 99, 51, (Math.max(0, boss.hp) / boss.maxHp) * 198, 6);
  }
}

function renderScreenOverlays() {
  if (gameState === 'START') {
    ctx.fillStyle = 'rgba(2, 2, 8, 0.85)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00f0ff'; ctx.textAlign = 'center';
    ctx.font = 'bold 26px monospace'; ctx.fillText('CYBER-WING: ZERO HOUR', canvas.width / 2, 260);
    ctx.font = '14px monospace'; ctx.fillStyle = '#fff';
    ctx.fillText('WASD / ARROWS : Move', canvas.width / 2, 330);
    ctx.fillText('SPACE / K     : Shoot', canvas.width / 2, 355);
    ctx.fillText('P             : Pause', canvas.width / 2, 380);
    ctx.fillStyle = '#00f0ff'; ctx.fillText('[ PRESS SPACE TO START ]', canvas.width / 2, 450);
  } else if (gameState === 'PAUSED') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00f0ff'; ctx.font = 'bold 30px monospace'; ctx.textAlign = 'center';
    ctx.fillText('SYSTEM PAUSED', canvas.width / 2, canvas.height / 2);
  } else if (gameState === 'GAMEOVER') {
    ctx.fillStyle = 'rgba(5, 0, 10, 0.85)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ff0055'; ctx.font = 'bold 32px monospace'; ctx.textAlign = 'center';
    ctx.fillText('SYSTEM DESTROYED', canvas.width / 2, canvas.height / 2 - 30);
    ctx.fillStyle = '#fff'; ctx.font = '14px monospace';
    ctx.fillText(`FINAL SCORE: ${score}`, canvas.width / 2, canvas.height / 2 + 10);
    ctx.fillStyle = '#00f0ff'; ctx.fillText('[ SPACE TO RE-DEPLOY ]', canvas.width / 2, canvas.height / 2 + 60);
  }
}

// --- MAIN LOOP ---
function loop() {
  ctx.save();

  // Screen shake application
  if (shakeTime > 0) {
    const dx = (Math.random() - 0.5) * shakeTime;
    const dy = (Math.random() - 0.5) * shakeTime;
    ctx.translate(dx, dy); shakeTime--;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background render
  stars.forEach(s => {
    if (gameState === 'PLAYING') { s.y += s.speed; if (s.y > canvas.height) s.y = 0; }
    ctx.fillStyle = '#ffffff'; ctx.fillRect(s.x, s.y, s.s, s.s);
  });

  if (gameState === 'PLAYING') {
    player.update();
    spawnLogic();

    playerBullets.forEach(b => b.update());
    enemyBullets.forEach(b => b.update());
    enemies.forEach(e => e.update());
    powerUps.forEach(p => p.update());
    particles.forEach(pt => pt.update());

    resolveCollisions();

    // Cleaning memory pools
    playerBullets = playerBullets.filter(b => !b.dead);
    enemyBullets = enemyBullets.filter(b => !b.dead);
    enemies = enemies.filter(e => !e.dead);
    powerUps = powerUps.filter(p => !p.dead);
    particles = particles.filter(pt => pt.alpha > 0);
  }

  // Draw entities
  if (gameState !== 'START') player.draw(ctx);
  playerBullets.forEach(b => b.draw(ctx));
  enemyBullets.forEach(b => b.draw(ctx));
  enemies.forEach(e => e.draw(ctx));
  powerUps.forEach(p => p.draw(ctx));
  particles.forEach(pt => pt.draw(ctx));

  ctx.restore(); // Restore shake matrix transform

  renderHUD();
  renderScreenOverlays();

  requestAnimationFrame(loop);
}

resetGame();
loop();
</script>
</body>
</html>
