<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Journey For You ✨</title>
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Caveat:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', system-ui, -apple-system, sans-serif;
            background: #0f0c1b; /* Rich deep twilight color base */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Interactive Live Canvas Background layer */
        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Gorgeous translucent premium glass card overlay */
        .card {
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3), 
                        0 0 40px rgba(255, 105, 180, 0.15);
            max-width: 410px;
            width: 88%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 10;
            transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        /* Multistep animation controls */
        .step {
            display: none;
        }
        .step.active {
            display: block;
            animation: elegantFadeUp 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        h1 {
            color: #ffffff;
            font-size: 1.75rem;
            margin-bottom: 20px;
            font-weight: 600;
            line-height: 1.4;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .highlight-text {
            font-family: 'Caveat', cursive;
            color: #ff65a3;
            font-size: 2.5rem;
            display: block;
            margin-top: 5px;
            text-shadow: 0 0 15px rgba(255, 101, 163, 0.4);
        }

        .image-box img {
            width: 160px;
            height: 160px;
            object-fit: contain;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
        }

        /* Timeline Pagination Indicators */
        .progress-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            transition: all 0.4s ease;
        }
        .dot.active {
            background: #ff65a3;
            width: 24px;
            box-shadow: 0 0 10px #ff65a3;
        }

        /* Interactive Premium Buttons */
        .btn-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 15px;
            min-height: 80px;
            position: relative;
        }

        button {
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s, box-shadow 0.3s;
            outline: none;
        }

        .next-btn {
            background: linear-gradient(135deg, #ff65a3 0%, #fd3a84 100%);
            color: white;
            width: 100%;
        }
        .next-btn:hover {
            box-shadow: 0 10px 25px rgba(253, 58, 132, 0.4);
            transform: translateY(-2px);
        }

        #yesBtn {
            background: linear-gradient(135deg, #00b4db 0%, #0083b0 100%);
            color: white;
        }
        #yesBtn:hover {
            box-shadow: 0 10px 25px rgba(0, 180, 219, 0.4);
        }

        #noBtn {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.15);
            position: absolute;
        }

        /* Pure CSS Floating aesthetic Background Elements */
        .heart-float {
            position: absolute;
            font-size: 22px;
            color: rgba(255, 105, 180, 0.15);
            animation: floatSlowly 8s linear infinite;
            bottom: -50px;
            user-select: none;
            pointer-events: none;
            z-index: 2;
        }

        @keyframes floatSlowly {
            0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
            15% { opacity: 1; }
            100% { transform: translateY(-110vh) rotate(270deg) scale(1.2); opacity: 0; }
        }
        @keyframes elegantFadeUp {
            from { opacity: 0; transform: translateY(20px); filter: blur(5px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
    </style>
</head>
<body>

    <!-- Dynamic interactive elements background -->
    <canvas id="bgCanvas"></canvas>

    <div class="card">
        <!-- Structural progress tracking dashboard -->
        <div class="progress-dots" id="dotsContainer">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <!-- STEP 1 -->
        <div class="step active" id="step1">
            <div class="image-box">
                <img src="https://giphy.com" alt="Cute wave animation">
            </div>
            <h1>Hey, stop scrolling for a second... <span class="highlight-text">I have a secret</span></h1>
            <button class="next-btn" onclick="nextStep(2)">What is it? 👀</button>
        </div>

        <!-- STEP 2 -->
        <div class="step" id="step2">
            <div class="image-box">
                <img src="https://giphy.com" alt="Thinking face animation">
            </div>
            <h1>Out of all the paths I cross every day, <span class="highlight-text">yours is my favorite. ☀️</span></h1>
            <button class="next-btn" onclick="nextStep(3)">Tell me more... 🥰</button>
        </div>

        <!-- STEP 3 -->
        <div class="step" id="step3">
            <div class="image-box">
                <img src="https://giphy.com" alt="Cute shy look animation">
            </div>
            <h1>You have this effortless way of making everything feel <span class="highlight-text">so much brighter. ✨</span></h1>
            <button class="next-btn" onclick="nextStep(4)">Click Here ❤️</button>
        </div>

        <!-- STEP 4: INTERACTIVE DANCE PORTAL -->
        <div class="step" id="step4">
            <div class="image-box">
                <img id="finalGif" src="https://giphy.com" alt="Date proposal character">
            </div>
            <h1 id="questionText">Will you make me the absolute luckiest guy and <span class="highlight-text">go on a date with me? 🌹</span></h1>
            
            <div class="btn-wrapper">
                <button id="yesBtn" onclick="selectYes()">Yes! ✨</button>
                <button id="noBtn" onmouseover="dodgeButton()" onclick="dodgeButton()">No 🥺</button>
            </div>
        </div>
    </div>

    <script>
        /* --- DYNAMIC INTERACTIVE LIVE CANVAS BACKGROUND --- */
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        let mouse = { x: null, y: null, radius: 120 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.baseX = this.x;
                this.baseY = this.y;
                this.size = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
            }
            update() {
                // Free idle drifting floating logic
                this.baseX += this.speedX;
                this.baseY += this.speedY;

                // Screen boundary resets
                if (this.baseX < 0 || this.baseX > canvas.width) this.speedX *= -1;
                if (this.baseY < 0 || this.baseY > canvas.height) this.speedY *= -1;

                // Interactive cursor interaction collision wrap
                let dx = mouse.x - this.baseX;
                let dy = mouse.y - this.baseY;
