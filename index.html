<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Quick Question...</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
      position: relative;
    }

    /* Floating Heart Styles */
    .heart {
      position: absolute;
      background-color: #ffb6c1;
      display: inline-block;
      width: 10px;
      height: 10px;
      transform: rotate(-45deg);
      opacity: 0.8;
      animation: floatUp 4s linear infinite;
      pointer-events: none;
      z-index: 1;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: #ffb6c1;
      border-radius: 50%;
    }

    .heart::before {
      top: -5px;
      left: 0;
    }

    .heart::after {
      top: 0;
      left: 5px;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) rotate(-45deg) scale(1);
        opacity: 0.8;
      }
      100% {
        transform: translateY(-10vh) rotate(-45deg) scale(1.2);
        opacity: 0;
      }
    }

    /* Frosted glass card container */
    .card-container {
      background: rgba(255, 255, 255, 0.75);
      padding: 40px 30px;
      border-radius: 24px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      text-align: center;
      max-width: 90%;
      width: 420px;
      position: relative;
      z-index: 10;
    }

    /* First Page (Quote Screen) */
    #page1 h1 {
      color: #6a3089;
      font-size: 1.8rem;
      font-style: italic;
      margin-bottom: 30px;
      line-height: 1.4;
    }

    /* Second Page (Date Proposal Screen) */
    #page2 {
      display: none;
    }

    #page2 h1 {
      color: #6a3089;
      font-size: 2rem;
      margin-top: 0;
      margin-bottom: 25px;
    }

    .btn-container {
      position: relative;
      width: 100%;
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    button {
      padding: 12px 28px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    #nextBtn, #yesBtn {
      background-color: #8a4ba8;
      color: white;
      box-shadow: 0 4px 12px rgba(138, 75, 168, 0.3);
    }

    #nextBtn:hover, #yesBtn:hover {
      transform: scale(1.08);
      background-color: #733c8f;
    }

    #noBtn {
      background-color: #e07aa0;
      color: white;
      position: absolute;
      top: 50%;
      left: 65%;
      transform: translate(-50%, -50%);
      transition: top 0.15s ease, left 0.15s ease;
      box-shadow: 0 4px 12px rgba(224, 122, 160, 0.3);
    }

    #responseMessage {
      font-size: 1.6rem;
      font-weight: bold;
      color: #6a3089;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <!-- PAGE 1: Intro Quote -->
    <div id="page1">
      <h1>"Would you like to listen to me once?" 💭✨</h1>
      <button id="nextBtn">Sure ❤️</button>
    </div>

    <!-- PAGE 2: The Evasion Proposal -->
    <div id="page2">
      <h1 id="question">Would you like to go on a cafe date with me? ☕✨</h1>

      <div class="btn-container">
        <button id="yesBtn">Yes!</button>
        <button id="noBtn">No</button>
      </div>

      <div id="responseMessage">Yay! Can't wait for our date! ☕❤️</div>
    </div>
  </div>

  <script>
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');
    const nextBtn = document.getElementById('nextBtn');
    
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const responseMessage = document.getElementById('responseMessage');
    const question = document.getElementById('question');

    // Transition from Page 1 to Page 2
    nextBtn.addEventListener('click', () => {
      page1.style.display = 'none';
      page2.style.display = 'block';
    });

    // Move the "No" button smoothly away when hovered or touched
    function moveButton() {
      const padding = 60;
      const maxX = window.innerWidth - noBtn.offsetWidth - padding;
      const maxY = window.innerHeight - noBtn.offsetHeight - padding;

      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

      noBtn.style.position = 'fixed';
      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;
    }

    noBtn.addEventListener('mouseenter', moveButton);
    noBtn.addEventListener('touchstart', moveButton);

    // Reveal final acceptance message
    yesBtn.addEventListener('click', () => {
      question.style.display = 'none';
      document.querySelector('.btn-container').style.display = 'none';
      responseMessage.style.display = 'block';
    });

    // Floating Hearts Script
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = Math.random() * 2 + 3 + "s";
      heart.style.opacity = Math.random() * 0.5 + 0.3;
      
      const size = Math.random() * 10 + 5 + "px";
      heart.style.width = size;
      heart.style.height = size;

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }

    setInterval(createHeart, 300);
  </script>

</body>
</html>
