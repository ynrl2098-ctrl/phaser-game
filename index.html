<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question ✨</title>
    <style>
        /* Modern, vibrant gradient background */
        body {
            font-family: 'Poppins', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffb3c6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Glassmorphism card look */
        .card {
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 45px 35px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(255, 75, 110, 0.15);
            max-width: 420px;
            width: 85%;
            border: 1px solid rgba(255, 255, 255, 0.6);
            z-index: 10;
            transition: all 0.5s ease;
        }

        h1 {
            color: #ff4b6e;
            font-size: 2.2rem;
            margin-bottom: 25px;
            font-weight: 700;
            line-height: 1.3;
        }

        /* Responsive image wrapping */
        .image-box img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            margin-bottom: 25px;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.08));
        }

        /* Flexbox structure to handle growing Yes button elegantly */
        .btn-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            margin-top: 15px;
            min-height: 120px;
            position: relative;
        }

        button {
            padding: 14px 36px;
            font-size: 1.15rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.3s, box-shadow 0.3s;
        }

        #yesBtn {
            background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
            color: white;
        }

        #yesBtn:hover {
            box-shadow: 0 12px 20px rgba(76, 175, 80, 0.3);
        }

        #noBtn {
            background: linear-gradient(135deg, #ff4b6e 0%, #ff2a55 100%);
            color: white;
            position: absolute;
        }

        /* Floating background hearts animation */
        .heart-bg {
            position: absolute;
            font-size: 24px;
            color: rgba(255, 75, 110, 0.2);
            animation: floatUp 6s linear infinite;
            bottom: -50px;
            user-select: none;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-105vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Floating decorative background shapes -->
    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 4 + 's';
            heart.style.fontSize = Math.random() * 15 + 15 + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 7000);
        }
        setInterval(createHeart, 400);
    </script>

    <div class="card">
        <div class="image-box">
            <!-- Smooth interactive reaction GIF -->
            <img id="displayGif" src="https://giphy.com" alt="Cute character asking">
        </div>
        <h1 id="questionText">Will you go on a special date with me? ✨</h1>
        
        <div class="btn-wrapper">
            <button id="yesBtn" onclick="selectYes()">Yes! 🥰</button>
            <button id="noBtn" onmouseover="dodgeButton()" onclick="dodgeButton()">No 🥺</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const questionText = document.getElementById('questionText');
        const displayGif = document.getElementById('displayGif');

        let scaleFactor = 1.0;
        let phrases = ["No 🥺", "Are you sure? 💔", "Puuulease? 🎀", "Think again! 👀", "Don't do this! 😭"];
        let phraseIndex = 0;

        function dodgeButton() {
            // Screen positioning limits keeping margins safe
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 60) + 30;
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 60) + 30;
            
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;

            // Cycle through pleading text on the No button
            phraseIndex = (phraseIndex + 1) % phrases.length;
            noBtn.innerText = phrases[phraseIndex];

            // Scale the Yes button smoothly
            scaleFactor += 0.25;
            yesBtn.style.transform = `scale(${scaleFactor})`;
        }

        function selectYes() {
            questionText.innerHTML = "Yay! See you soon! ❤️✨";
            displayGif.src = "https://giphy.com";
            noBtn.style.display = 'none';
            yesBtn.style.transform = "scale(1.15)";
            
            // Turn the hearts faster and change theme dynamically
            document.querySelector('.card').style.background = 'rgba(255, 255, 255, 0.95)';
        }
    </script>
</body>
</html>
