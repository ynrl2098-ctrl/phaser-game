<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Space Invasion</title>
  <style>
    body {
      margin: 0;
      background-color: #050515;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      font-family: sans-serif;
    }
  </style>
  <!-- Load Phaser 3 -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>

<script>
const config = {
  type: Phaser.AUTO,
  width: 400,
  height: 600,
  physics: {
    default: 'arcade',
    arcade: { gravity: { y: 0 }, debug: false }
  },
  scene: { preload: preload, create: create, update: update }
};

let player, cursors, aliens, scoreText;
let score = 0;
let spawnTimer = 0;
let game = new Phaser.Game(config);

function preload() {}

function create() {
  // Create Spaceship using Emoji text
  player = this.add.text(200, 530, '🚀', { fontSize: '32px' }).setOrigin(0.5);
  this.physics.add.existing(player);
  player.body.setCollideWorldBounds(true);
  player.body.setSize(30, 30); // Adjust collision boundary

  // Group for falling aliens
  aliens = this.physics.add.group();

  // Score display
  scoreText = this.add.text(16, 16, 'Score: 0', { fontSize: '20px', fill: '#fff' });

  // Keyboard controls
  cursors = this.input.keyboard.createCursorKeys();

  // Collision detection
  this.physics.add.overlap(player, aliens, gameOver, null, this);
}

function update(time, delta) {
  // Player Movement
  if (cursors.left.isDown) {
    player.body.setVelocityX(-280);
  } else if (cursors.right.isDown) {
    player.body.setVelocityX(280);
  } else {
    player.body.setVelocityX(0);
  }

  // Spawn Aliens periodically
  spawnTimer += delta;
  if (spawnTimer > 700) {
    spawnTimer = 0;
    let xPos = Phaser.Math.Between(30, 370);
    
    // Create Alien using Emoji text
    let alien = this.add.text(xPos, -20, '👾', { fontSize: '28px' }).setOrigin(0.5);
    aliens.add(alien);
    this.physics.add.existing(alien);
    alien.body.setSize(25, 25);
    
    // Increase speed as score grows
    alien.body.setVelocityY(200 + score * 4); 
  }

  // Cleanup off-screen aliens and update score
  aliens.getChildren().forEach((alien) => {
    if (alien.y > 630) {
      alien.destroy();
      score += 10;
      scoreText.setText('Score: ' + score);
    }
  });
}

function gameOver() {
  this.physics.pause();
  player.setText('💥'); // Explosion on hit
  this.add.text(90, 270, 'GAME OVER', { fontSize: '36px', fill: '#ff0055', fontWeight: 'bold' });
  this.add.text(85, 320, 'Refresh page to restart', { fontSize: '16px', fill: '#aaa' });
}
</script>

</body>
</html>
