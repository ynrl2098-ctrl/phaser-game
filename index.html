<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Phaser Dodge Game</title>
  <style>
    body {
      margin: 0;
      background-color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      font-family: sans-serif;
    }
  </style>
  <!-- Load Phaser 3 -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>

<script>
const config = {
  type: Phaser.AUTO,
  width: 400,
  height: 600,
  physics: {
    default: 'arcade',
    arcade: { gravity: { y: 0 }, debug: false }
  },
  scene: { preload: preload, create: create, update: update }
};

let player, cursors, obstacles, scoreText;
let score = 0;
let spawnTimer = 0;
let game = new Phaser.Game(config);

function preload() {}

function create() {
  // Create Player (Green Square)
  player = this.add.rectangle(200, 530, 30, 30, 0x00ff00);
  this.physics.add.existing(player);
  player.body.setCollideWorldBounds(true);

  // Group for obstacles
  obstacles = this.physics.add.group();

  // Score display
  scoreText = this.add.text(16, 16, 'Score: 0', { fontSize: '20px', fill: '#fff' });

  // Keyboard controls
  cursors = this.input.keyboard.createCursorKeys();

  // Collision detection
  this.physics.add.overlap(player, obstacles, gameOver, null, this);
}

function update(time, delta) {
  // Player Controls
  if (cursors.left.isDown) {
    player.body.setVelocityX(-250);
  } else if (cursors.right.isDown) {
    player.body.setVelocityX(250);
  } else {
    player.body.setVelocityX(0);
  }

  // Spawn obstacles
  spawnTimer += delta;
  if (spawnTimer > 800) {
    spawnTimer = 0;
    let xPos = Phaser.Math.Between(20, 380);
    let obstacle = this.add.rectangle(xPos, -20, 25, 25, 0xff0055);
    obstacles.add(obstacle);
    this.physics.add.existing(obstacle);
    
    // Increase speed as score grows
    obstacle.body.setVelocityY(200 + score * 5); 
  }

  // Score points when obstacles clear screen
  obstacles.getChildren().forEach((obs) => {
    if (obs.y > 620) {
      obs.destroy();
      score += 10;
      scoreText.setText('Score: ' + score);
    }
  });
}

function gameOver() {
  this.physics.pause();
  player.fillColor = 0xff0000;
  this.add.text(100, 280, 'GAME OVER', { fontSize: '32px', fill: '#fff' });
  this.add.text(80, 320, 'Refresh page to restart', { fontSize: '16px', fill: '#aaa' });
}
</script>

</body>
</html>
