<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Story For You ✨</title>
    <style>
        body {
            font-family: 'Poppins', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffb3c6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        .card {
            text-align: center;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(255, 75, 110, 0.15);
            max-width: 400px;
            width: 85%;
            border: 1px solid rgba(255, 255, 255, 0.6);
            z-index: 10;
            transition: all 0.4s ease;
        }

        /* Step screens are hidden by default except step 1 */
        .step {
            display: none;
        }
        .step.active {
            display: block;
            animation: fadeIn 0.5s ease forward;
        }

        h1 {
            color: #ff4b6e;
            font-size: 1.8rem;
            margin-bottom: 20px;
            font-weight: 700;
            line-height: 1.4;
        }

        .image-box img {
            width: 160px;
            height: 160px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        /* Progress Dots */
        .progress-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: #ffccd5;
            border-radius: 50px;
            transition: all 0.3s;
        }
        .dot.active {
            background: #ff4b6e;
            width: 20px;
        }

        /* Buttons layout */
        .btn-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 15px;
            min-height: 80px;
            position: relative;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s;
        }

        .next-btn {
            background: linear-gradient(135deg, #ff4b6e 0%, #ff2a55 100%);
            color: white;
            width: 100%;
        }

        #yesBtn {
            background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
            color: white;
        }

        #noBtn {
            background: linear-gradient(135deg, #757575 0%, #616161 100%);
            color: white;
            position: absolute;
        }

        /* Floating background hearts animation */
        .heart-bg {
            position: absolute;
            font-size: 20px;
            color: rgba(255, 75, 110, 0.2);
            animation: floatUp 6s linear infinite;
            bottom: -50px;
            user-select: none;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Floating hearts script -->
    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 4 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 7000);
        }
        setInterval(createHeart, 500);
    </script>

    <div class="card">
        <!-- Progress Indicators -->
        <div class="progress-dots" id="dotsContainer">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <!-- STEP 1 -->
        <div class="step active" id="step1">
            <div class="image-box">
                <img src="https://giphy.com" alt="Cute wave">
            </div>
            <h1>Hey, I wanted to tell you something... ✨</h1>
            <button class="next-btn" onclick="nextStep(2)">What is it? 👀</button>
        </div>

        <!-- STEP 2 -->
        <div class="step" id="step2">
            <div class="image-box">
                <img src="https://giphy.com" alt="Thinking">
            </div>
            <h1>Every moment spent with you makes my day a whole lot brighter. ☀️</h1>
            <button class="next-btn" onclick="nextStep(3)">Go on... 🥰</button>
        </div>

        <!-- STEP 3 -->
        <div class="step" id="step3">
            <div class="image-box">
                <img src="https://giphy.com" alt=" Shy flower">
            </div>
            <h1>You're incredibly special to me, and I can't look at you without smiling. 🌸</h1>
            <button class="next-btn" onclick="nextStep(4)">Next ❤️</button>
        </div>

        <!-- STEP 4: THE PROPOSAL -->
        <div class="step" id="step4">
            <div class="image-box">
                <img id="finalGif" src="https://giphy.com" alt="Date ask">
            </div>
            <h1 id="questionText">So... Will you make me the happiest person and go out on a date with me? 🌹</h1>
            
            <div class="btn-wrapper">
                <button id="yesBtn" onclick="selectYes()">Yes! Custom 🎉</button>
                <button id="noBtn" onmouseover="dodgeButton()" onclick="dodgeButton()">No 🥺</button>
            </div>
        </div>
    </div>

    <script>
        let currentStep = 1;
        const dots = document.querySelectorAll('.dot');
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const questionText = document.getElementById('questionText');
        const finalGif = document.getElementById('finalGif');
        const dotsContainer = document.getElementById('dotsContainer');

        let scaleFactor = 1.0;

        // Navigation controller
        function nextStep(stepNumber) {
            document.getElementById(`step${currentStep}`).classList.remove('active');
            document.getElementById(`step${stepNumber}`).classList.add('active');
            
            dots[currentStep - 1].classList.remove('active');
            dots[stepNumber - 1].classList.add('active');
            
            currentStep = stepNumber;
        }

        // Runaway logic for the NO button
        function dodgeButton() {
            // Generates coordinates keeping the button safely inside the viewport
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 60) + 30;
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 60) + 30;
            
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;

            // Increase yes button size slightly every time they try to hover/click No
            scaleFactor += 0.2;
            yesBtn.style.transform = `scale(${scaleFactor})`;
        }

        // Celebration screen trigger
        function selectYes() {
            questionText.innerHTML = "Yay! It's a date! Can't wait! 🥰❤️✨";
            finalGif.src = "https://giphy.com";
            
            noBtn.style.display = 'none';
            dotsContainer.style.display = 'none';
            yesBtn.style.transform = "scale(1.1)";
            yesBtn.removeAttribute('onclick');
        }
    </script>
</body>
</html>
