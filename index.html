<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Deep Space: Hyperdrive</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020208;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: #fff;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.2);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 8px;
      overflow: hidden;
    }
    canvas { display: block; background: #000; }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="canvas" width="500" height="700"></canvas>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// --- Input Handling ---
const keys = {};
window.addEventListener('keydown', e => { if(e.code === 'Space') e.preventDefault(); keys[e.code] = true; });
window.addEventListener('keyup', e => keys[e.code] = false);

// --- Particle Engine ---
class ParticleSystem {
  constructor() { this.particles = []; }
  spawn(x, y, color, count = 8, speedMult = 1) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = (Math.random() * 3 + 1) * speedMult;
      this.particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: Math.random() * 3 + 1,
        color, alpha: 1,
        decay: Math.random() * 0.03 + 0.015
      });
    }
  }
  update() {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx; p.y += p.vy;
      p.alpha -= p.decay;
      if (p.alpha <= 0) this.particles.splice(i, 1);
    }
  }
  draw(ctx) {
    this.particles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }
}
const fx = new ParticleSystem();

// --- Background Engine ---
class Starfield {
  constructor() {
    this.stars = Array.from({ length: 120 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 2 + 0.5,
      speed: Math.random() * 3 + 0.5,
      color: ['#fff', '#64d2ff', '#ff80bf'][Math.floor(Math.random() * 3)]
    }));
  }
  update() {
    this.stars.forEach(s => {
      s.y += s.speed;
      if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
    });
  }
  draw(ctx) {
    this.stars.forEach(s => {
      ctx.fillStyle = s.color;
      ctx.fillRect(s.x, s.y, s.size, s.size);
    });
  }
}

// --- Entities ---
class Player {
  constructor() {
    this.x = canvas.width / 2;
    this.y = canvas.height - 80;
    this.speed = 6;
    this.radius = 16;
    this.weaponLevel = 1;
    this.fireTimer = 0;
    this.shield = 100;
    this.maxShield = 100;
  }
  update() {
    if (keys['ArrowLeft'] || keys['KeyA']) this.x -= this.speed;
    if (keys['ArrowRight'] || keys['KeyD']) this.x += this.speed;
    if (keys['ArrowUp'] || keys['KeyW']) this.y -= this.speed;
    if (keys['ArrowDown'] || keys['KeyS']) this.y += this.speed;

    // Boundaries
    this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
    this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));

    // Thruster visual
    fx.spawn(this.x + (Math.random() * 6 - 3), this.y + 18, '#00f0ff', 1, 0.5);

    // Auto-fire / manual fire
    if (this.fireTimer > 0) this.fireTimer--;
    if ((keys['Space'] || keys['KeyK']) && this.fireTimer === 0) {
      this.shoot();
      this.fireTimer = 10;
    }
  }
  shoot() {
    if (this.weaponLevel === 1) {
      bullets.push(new Bullet(this.x, this.y - 15, 0, -12, '#00f0ff'));
    } else if (this.weaponLevel === 2) {
      bullets.push(new Bullet(this.x - 10, this.y - 10, 0, -12, '#00f0ff'));
      bullets.push(new Bullet(this.x + 10, this.y - 10, 0, -12, '#00f0ff'));
    } else {
      bullets.push(new Bullet(this.x, this.y - 15, 0, -12, '#00f0ff'));
      bullets.push(new Bullet(this.x - 12, this.y - 5, -2, -11, '#ff0055'));
      bullets.push(new Bullet(this.x + 12, this.y - 5, 2, -11, '#ff0055'));
    }
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Ship Vector Art
    ctx.strokeStyle = '#00f0ff';
    ctx.fillStyle = '#051025';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -20);
    ctx.lineTo(16, 16);
    ctx.lineTo(8, 10);
    ctx.lineTo(-8, 10);
    ctx.lineTo(-16, 16);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Core Glow
    ctx.fillStyle = '#ff0055';
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

class Bullet {
  constructor(x, y, vx, vy, color) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.color = color;
    this.radius = 3;
    this.markedForDeletion = false;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    if (this.y < -10 || this.x < 0 || this.x > canvas.width) this.markedForDeletion = true;
  }
  draw(ctx) {
    ctx.save();
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 8;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

class Enemy {
  constructor(type = 1) {
    this.x = Math.random() * (canvas.width - 40) + 20;
    this.y = -30;
    this.type = type;
    this.markedForDeletion = false;
    
    if (type === 1) { // Standard Scout
      this.hp = 2; this.speed = 3.5; this.radius = 14; this.color = '#ff3366';
    } else { // Heavy Interceptor
      this.hp = 6; this.speed = 1.8; this.radius = 22; this.color = '#ff9900';
    }
  }
  update() {
    this.y += this.speed;
    if (this.type === 2) this.x += Math.sin(this.y * 0.03) * 2; // Sinusoidal movement
    if (this.y > canvas.height + 40) this.markedForDeletion = true;
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.strokeStyle = this.color;
    ctx.fillStyle = '#1a000d';
    ctx.lineWidth = 2;

    ctx.beginPath();
    if (this.type === 1) {
      ctx.moveTo(0, 16);
      ctx.lineTo(-14, -12);
      ctx.lineTo(0, -4);
      ctx.lineTo(14, -12);
    } else {
      ctx.moveTo(0, 22);
      ctx.lineTo(-20, 0);
      ctx.lineTo(-12, -20);
      ctx.lineTo(12, -20);
      ctx.lineTo(20, 0);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
}

class PowerUp {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.radius = 10;
    this.markedForDeletion = false;
  }
  update() {
    this.y += 1.5;
    if (this.y > canvas.height + 20) this.markedForDeletion = true;
  }
  draw(ctx) {
    ctx.save();
    ctx.shadowColor = '#00ffcc';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#00ffcc';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('P', this.x, this.y);
    ctx.restore();
  }
}

// --- Game Loop Core ---
const stars = new Starfield();
const player = new Player();
let bullets = [];
let enemies = [];
let powerUps = [];

let score = 0;
let enemySpawnTimer = 0;
let gameOver = false;

function handleCollisions() {
  // Bullets vs Enemies
  bullets.forEach(b => {
    enemies.forEach(e => {
      if (!b.markedForDeletion && !e.markedForDeletion) {
        const dist = Math.hypot(b.x - e.x, b.y - e.y);
        if (dist < b.radius + e.radius) {
          b.markedForDeletion = true;
          e.hp--;
          fx.spawn(b.x, b.y, b.color, 4);

          if (e.hp <= 0) {
            e.markedForDeletion = true;
            fx.spawn(e.x, e.y, e.color, 16, 1.5);
            score += e.type * 50;

            // Chance to drop powerup
            if (Math.random() < 0.2) powerUps.push(new PowerUp(e.x, e.y));
          }
        }
      }
    });
  });

  // Player vs Enemies
  enemies.forEach(e => {
    if (!e.markedForDeletion) {
      const dist = Math.hypot(player.x - e.x, player.y - e.y);
      if (dist < player.radius + e.radius) {
        e.markedForDeletion = true;
        fx.spawn(e.x, e.y, '#ff0055', 20, 2);
        player.shield -= 25;
        if (player.shield <= 0) gameOver = true;
      }
    }
  });

  // Player vs PowerUps
  powerUps.forEach(p => {
    if (!p.markedForDeletion) {
      const dist = Math.hypot(player.x - p.x, player.y - p.y);
      if (dist < player.radius + p.radius) {
        p.markedForDeletion = true;
        player.weaponLevel = Math.min(3, player.weaponLevel + 1);
        player.shield = Math.min(player.maxShield, player.shield + 20);
        fx.spawn(player.x, player.y, '#00ffcc', 12);
      }
    }
  });
}

function renderUI() {
  // Score
  ctx.fillStyle = '#00f0ff';
  ctx.font = '16px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`SCORE: ${score.toString().padStart(6, '0')}`, 15, 30);

  // Shield Bar
  ctx.strokeStyle = '#00f0ff';
  ctx.strokeRect(15, 42, 120, 10);
  ctx.fillStyle = player.shield > 30 ? '#00f0ff' : '#ff0055';
  ctx.fillRect(16, 43, (Math.max(0, player.shield) / player.maxShield) * 118, 8);

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ff0055';
    ctx.font = 'bold 36px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('CRITICAL FAILURE', canvas.width / 2, canvas.height / 2 - 20);

    ctx.fillStyle = '#fff';
    ctx.font = '16px monospace';
    ctx.fillText(`FINAL SCORE: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
    ctx.fillText('Refresh Page to Deploy', canvas.width / 2, canvas.height / 2 + 60);
  }
}

function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  stars.update();
  stars.draw(ctx);

  if (!gameOver) {
    player.update();
    player.draw(ctx);

    // Spawning Enemies
    enemySpawnTimer++;
    if (enemySpawnTimer > Math.max(20, 60 - Math.floor(score / 400))) {
      enemySpawnTimer = 0;
      enemies.push(new Enemy(Math.random() < 0.75 ? 1 : 2));
    }

    // Entity updates
    bullets.forEach(b => b.update());
    enemies.forEach(e => e.update());
    powerUps.forEach(p => p.update());

    handleCollisions();

    // Cleanup arrays
    bullets = bullets.filter(b => !b.markedForDeletion);
    enemies = enemies.filter(e => !e.markedForDeletion);
    powerUps = powerUps.filter(p => !p.markedForDeletion);
  }

  // Draw Entities
  bullets.forEach(b => b.draw(ctx));
  enemies.forEach(e => e.draw(ctx));
  powerUps.forEach(p => p.draw(ctx));
  fx.update();
  fx.draw(ctx);

  renderUI();

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
