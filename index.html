<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr. Mario Bros - Classic Edition</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f0f1b;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h1 {
      margin: 10px 0 5px;
      color: #f8d820;
      text-shadow: 2px 2px #d82800;
      font-size: 28px;
    }
    p { margin: 0 0 15px; color: #a8a8a8; font-size: 14px; }
    canvas {
      border: 4px solid #fff;
      background: #5c94fc;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      image-rendering: pixelated; /* Crisp pixel art rendering */
    }
  </style>
</head>
<body>

  <h1>SUPER MARIO - PIXEL EDITION</h1>
  <p><strong>A / D</strong> or <strong>Arrows</strong> to move | <strong>Space / W</strong> to jump | <strong>Shift</strong> to run</p>
  <canvas id="gameCanvas" width="800" height="400"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Enable crisp pixel art scales
    ctx.imageSmoothingEnabled = false;

    // Physics Settings
    const gravity = 0.45;
    const friction = 0.85;

    // Player State
    const player = {
      x: 50,
      y: 300,
      width: 24,
      height: 32,
      vx: 0,
      vy: 0,
      speed: 0.6,
      maxSpeed: 4,
      jumpForce: -10.5,
      grounded: false,
      facing: 'right',
      score: 0,
      coins: 0
    };

    // World Elements
    const platforms = [
      { x: 0, y: 360, width: 800, height: 40, type: 'ground' },
      { x: 120, y: 260, width: 96, height: 32, type: 'brick' },
      { x: 300, y: 190, width: 128, height: 32, type: 'brick' },
      { x: 520, y: 260, width: 64, height: 96, type: 'pipe' },
      { x: 660, y: 200, width: 96, height: 32, type: 'brick' }
    ];

    const coins = [
      { x: 140, y: 220, animationFrame: 0, collected: false },
      { x: 180, y: 220, animationFrame: 0, collected: false },
      { x: 330, y: 150, animationFrame: 0, collected: false },
      { x: 360, y: 150, animationFrame: 0, collected: false },
      { x: 390, y: 150, animationFrame: 0, collected: false },
      { x: 680, y: 160, animationFrame: 0, collected: false }
    ];

    // Input Listeners
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Procedural Pixel Art Renderers
    function drawMario(x, y, facing) {
      ctx.save();
      if (facing === 'left') {
        ctx.translate(x + player.width, y);
        ctx.scale(-1, 1);
        x = 0;
        y = 0;
      }

      // Cap
      ctx.fillStyle = '#f83800';
      ctx.fillRect(x + 6, y, 14, 6);
      ctx.fillRect(x + 6, y + 4, 18, 4);

      // Face & Ear
      ctx.fillStyle = '#fcb088';
      ctx.fillRect(x + 4, y + 8, 16, 8);
      ctx.fillRect(x + 2, y + 10, 4, 4);

      // Eye & Mustache
      ctx.fillStyle = '#000000';
      ctx.fillRect(x + 14, y + 8, 2, 4); // Eye
      ctx.fillRect(x + 8, y + 14, 12, 4); // Mustache

      // Hair
      ctx.fillStyle = '#6c3c00';
      ctx.fillRect(x + 4, y + 8, 4, 4);

      // Shirt
      ctx.fillStyle = '#f83800';
      ctx.fillRect(x + 4, y + 18, 16, 8);

      // Overalls
      ctx.fillStyle = '#0028c8';
      ctx.fillRect(x + 6, y + 20, 12, 10);
      ctx.fillRect(x + 4, y + 24, 16, 6);

      // Buttons
      ctx.fillStyle = '#fcb088';
      ctx.fillRect(x + 6, y + 22, 2, 2);
      ctx.fillRect(x + 14, y + 22, 2, 2);

      // Shoes
      ctx.fillStyle = '#6c3c00';
      ctx.fillRect(x + 2, y + 28, 8, 4);
      ctx.fillRect(x + 14, y + 28, 8, 4);

      ctx.restore();
    }

    function drawBrick(x, y, width, height) {
      for (let i = 0; i < width; i += 16) {
        for (let j = 0; j < height; j += 16) {
          ctx.fillStyle = '#c84c0c';
          ctx.fillRect(x + i, y + j, 16, 16);
          ctx.fillStyle = '#000000';
          ctx.fillRect(x + i, y + j, 16, 1);
          ctx.fillRect(x + i, y + j, 1, 16);
          ctx.fillStyle = '#fcb088';
          ctx.fillRect(x + i + 1, y + j + 1, 14, 1);
          ctx.fillRect(x + i + 1, y + j + 1, 1, 14);
        }
      }
    }

    function drawPipe(x, y, width, height) {
      // Pipe Body
      ctx.fillStyle = '#00a800';
      ctx.fillRect(x + 4, y + 16, width - 8, height - 16);
      ctx.fillStyle = '#a8e420';
      ctx.fillRect(x + 8, y + 16, 4, height - 16);

      // Pipe Top / Rim
      ctx.fillStyle = '#00a800';
      ctx.fillRect(x, y, width, 16);
      ctx.fillStyle = '#a8e420';
      ctx.fillRect(x + 4, y, 4, 16);

      // Black Outline Highlights
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, width, 16);
      ctx.strokeRect(x + 4, y + 16, width - 8, height - 16);
    }

    function drawGround(x, y, width, height) {
      // Dirt texture
      ctx.fillStyle = '#c84c0c';
      ctx.fillRect(x, y, width, height);
      // Top Grass
      ctx.fillStyle = '#00a800';
      ctx.fillRect(x, y, width, 8);
      ctx.fillStyle = '#a8e420';
      ctx.fillRect(x, y, width, 2);
    }

    function drawCoin(x, y, tick) {
      const frame = Math.floor(tick / 10) % 4;
      const widths = [12, 8, 4, 8];
      const offset = (12 - widths[frame]) / 2;

      ctx.fillStyle = '#f8d820';
      ctx.fillRect(x + offset, y, widths[frame], 14);
      ctx.fillStyle = '#fcb088';
      ctx.fillRect(x + offset + 2, y + 2, Math.max(1, widths[frame] - 4), 10);
    }

    let globalTick = 0;

    function update() {
      globalTick++;

      // Speed Modifier (Running)
      const currentMaxSpeed = keys['ShiftLeft'] || keys['ShiftRight'] ? player.maxSpeed * 1.4 : player.maxSpeed;

      // Horizontal Controls with Momentum
      if (keys['ArrowRight'] || keys['KeyD']) {
        if (player.vx < currentMaxSpeed) player.vx += player.speed;
        player.facing = 'right';
      } else if (keys['ArrowLeft'] || keys['KeyA']) {
        if (player.vx > -currentMaxSpeed) player.vx -= player.speed;
        player.facing = 'left';
      } else {
        player.vx *= friction;
      }

      // Jump Impulse
      if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.grounded) {
        player.vy = player.jumpForce;
        player.grounded = false;
      }

      // Apply Gravity
      player.vy += gravity;

      // Position Updates
      player.x += player.vx;
      player.y += player.vy;

      // Screen Boundaries
      if (player.x < 0) player.x = 0;
      if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

      // Platform Collisions
      player.grounded = false;
      platforms.forEach(plat => {
        if (
          player.x < plat.x + plat.width &&
          player.x + player.width > plat.x &&
          player.y + player.height <= plat.y + player.vy &&
          player.y + player.height + player.vy >= plat.y
        ) {
          player.vy = 0;
          player.y = plat.y - player.height;
          player.grounded = true;
        }
      });

      // Coin Pickups
      coins.forEach(coin => {
        if (!coin.collected) {
          if (
            player.x < coin.x + 12 &&
            player.x + player.width > coin.x &&
            player.y < coin.y + 14 &&
            player.y + player.height > coin.y
          ) {
            coin.collected = true;
            player.score += 200;
            player.coins += 1;
          }
        }
      });
    }

    function render() {
      // Clear Background (Sky)
      ctx.fillStyle = '#5c94fc';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Render Decorative Clouds
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(100, 80, 64, 24);
      ctx.fillRect(450, 60, 80, 24);

      // Render Platforms
      platforms.forEach(plat => {
        if (plat.type === 'ground') drawGround(plat.x, plat.y, plat.width, plat.height);
        else if (plat.type === 'brick') drawBrick(plat.x, plat.y, plat.width, plat.height);
        else if (plat.type === 'pipe') drawPipe(plat.x, plat.y, plat.width, plat.height);
      });

      // Render Animated Coins
      coins.forEach(coin => {
        if (!coin.collected) drawCoin(coin.x, coin.y, globalTick);
      });

      // Render Mario
      drawMario(player.x, player.y, player.facing);

      // Render Classic HUD
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 16px "Courier New", monospace';
      ctx.fillText(`MARIO`, 40, 30);
      ctx.fillText(`${String(player.score).padStart(6, '0')}`, 40, 50);

      ctx.fillText(`COINS`, 220, 30);
      ctx.fillText(`* ${String(player.coins).padStart(2, '0')}`, 220, 50);

      ctx.fillText(`WORLD`, 400, 30);
      ctx.fillText(`1-1`, 410, 50);
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
