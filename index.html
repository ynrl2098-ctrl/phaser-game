<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vice City 3D Sandbox</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Trebuchet MS', 'Arial', sans-serif;
      user-select: none;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
    }

    /* Vice City 80s Style HUD */
    .hud {
      position: absolute;
      top: 20px;
      right: 20px;
      text-align: right;
      color: #ff007f;
      text-shadow: 2px 2px 0px #00f0ff, -1px -1px 0px #000;
    }
    .title {
      font-size: 28px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }
    .stats {
      font-size: 22px;
      font-weight: bold;
      color: #facc15;
      text-shadow: 2px 2px 0px #000;
    }

    .controls-hint {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: #00f0ff;
      background: rgba(0,0,0,0.6);
      padding: 10px 15px;
      border: 1px solid #ff007f;
      border-radius: 4px;
      font-size: 14px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="game-container"></div>

  <div class="hud">
    <div class="title">VICE CITY 3D</div>
    <div class="stats" id="speedometer">000 MPH</div>
  </div>

  <div class="controls-hint">
    <b>CONTROLS:</b><br>
    W / Up Arrow: Accelerate<br>
    S / Down Arrow: Reverse / Brake<br>
    A / D / Left / Right: Steering
  </div>

  <script>
    // --- SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a0b2e); // Deep purple sunset
    scene.fog = new THREE.FogExp2(0x1a0b2e, 0.008);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('game-container').appendChild(renderer.domElement);

    // --- LIGHTS ---
    const ambientLight = new THREE.AmbientLight(0xff007f, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0x00f0ff, 0.8);
    dirLight.position.set(50, 100, 50);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // --- 80s SUNSET ---
    const sunGeo = new THREE.CircleGeometry(120, 32);
    const sunMat = new THREE.MeshBasicMaterial({ color: 0xff5500, fog: false });
    const sun = new THREE.Mesh(sunGeo, sunMat);
    sun.position.set(0, 40, -400);
    scene.add(sun);

    // --- CITY ENVIRONMENT ---
    const citySize = 600;
    const gridHelper = new THREE.GridHelper(citySize, 60, 0xff007f, 0x00f0ff);
    gridHelper.position.y = 0.1;
    scene.add(gridHelper);

    // Road Base
    const roadGeo = new THREE.PlaneGeometry(citySize, citySize);
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x0a0a12, roughness: 0.8 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    scene.add(road);

    // Buildings & Palm Trees
    const buildingGeo = new THREE.BoxGeometry(1, 1, 1);
    
    function createCity() {
      for (let x = -250; x <= 250; x += 40) {
        for (let z = -250; z <= 250; z += 40) {
          if (Math.abs(x) < 30 && Math.abs(z) < 30) continue; // Keep spawn clear

          if (Math.random() > 0.3) {
            // Neon Building
            const height = 15 + Math.random() * 45;
            const color = Math.random() > 0.5 ? 0x00f0ff : 0xff007f;
            const mat = new THREE.MeshStandardMaterial({ color: 0x111122, emissive: color, emissiveIntensity: 0.2 });
            const building = new THREE.Mesh(buildingGeo, mat);
            building.scale.set(20, height, 20);
            building.position.set(x, height / 2, z);
            scene.add(building);
          } else {
            // Palm Tree Trunk
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3d2314 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 10), trunkMat);
            trunk.position.set(x, 5, z);
            
            // Leaves
            const leafMat = new THREE.MeshBasicMaterial({ color: 0x00ff88 });
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(4, 5, 5), leafMat);
            leaves.position.set(x, 11, z);
            
            scene.add(trunk, leaves);
          }
        }
      }
    }
    createCity();

    // --- CAR CREATION (VICE CITY SPORTS CAR) ---
    const carGroup = new THREE.Group();

    // Body
    const carBodyGeo = new THREE.BoxGeometry(2.2, 0.8, 4.5);
    const carBodyMat = new THREE.MeshStandardMaterial({ color: 0xff0055, roughness: 0.2, metalness: 0.5 });
    const carBody = new THREE.Mesh(carBodyGeo, carBodyMat);
    carBody.position.y = 0.6;
    carGroup.add(carBody);

    // Cabin
    const cabinGeo = new THREE.BoxGeometry(1.8, 0.6, 2.2);
    const cabinMat = new THREE.MeshStandardMaterial({ color: 0x00f0ff, roughness: 0.1, transparent: true, opacity: 0.7 });
    const cabin = new THREE.Mesh(cabinGeo, cabinMat);
    cabin.position.set(0, 1.2, -0.2);
    carGroup.add(cabin);

    // Wheels
    const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.4, 16);
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
    
    const wheelPositions = [
      [-1.1, 0.4, 1.3], [1.1, 0.4, 1.3],
      [-1.1, 0.4, -1.3], [1.1, 0.4, -1.3]
    ];

    wheelPositions.forEach(pos => {
      const wheel = new THREE.Mesh(wheelGeo, wheelMat);
      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(...pos);
      carGroup.add(wheel);
    });

    scene.add(carGroup);

    // --- CAR PHYSICS & CONTROLS ---
    let speed = 0;
    let maxSpeed = 1.8;
    let accel = 0.03;
    let friction = 0.96;
    let turnSpeed = 0.035;
    let angle = 0;

    const keys = {};
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    // --- GAME LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      // Driving Physics
      if (keys['w'] || keys['arrowup']) speed = Math.min(speed + accel, maxSpeed);
      if (keys['s'] || keys['arrowdown']) speed = Math.max(speed - accel, -maxSpeed * 0.5);

      speed *= friction;

      if (Math.abs(speed) > 0.01) {
        const dir = speed > 0 ? 1 : -1;
        if (keys['a'] || keys['arrowleft']) angle += turnSpeed * dir;
        if (keys['d'] || keys['arrowright']) angle -= turnSpeed * dir;
      }

      carGroup.rotation.y = angle;
      carGroup.position.x += Math.sin(angle) * speed;
      carGroup.position.z += Math.cos(angle) * speed;

      // Bound car to city limits
      carGroup.position.x = Math.max(-280, Math.min(280, carGroup.position.x));
      carGroup.position.z = Math.max(-280, Math.min(280, carGroup.position.z));

      // Third-Person Camera Follow
      const camOffset = new THREE.Vector3(0, 4, -10).applyAxisAngle(new THREE.Vector3(0, 1, 0), angle);
      camera.position.copy(carGroup.position).add(camOffset);
      camera.lookAt(carGroup.position.clone().add(new THREE.Vector3(0, 1, 0)));

      // HUD Speedometer
      const displaySpeed = Math.floor(Math.abs(speed) * 80);
      document.getElementById('speedometer').innerText = `${displaySpeed.toString().padStart(3, '0')} MPH`;

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
