<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Quick Question...</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
      position: relative;
    }

    /* Animated Glowing Hearts & Sparkles */
    .heart {
      position: absolute;
      background-color: #ffd1dc;
      display: inline-block;
      width: 12px;
      height: 12px;
      transform: rotate(-45deg);
      opacity: 0.8;
      box-shadow: 0 0 8px rgba(255, 209, 220, 0.8);
      animation: floatUp 4s linear infinite;
      pointer-events: none;
      z-index: 1;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      background-color: #ffd1dc;
      border-radius: 50%;
    }

    .heart::before {
      top: -6px;
      left: 0;
    }

    .heart::after {
      top: 0;
      left: 6px;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) rotate(-45deg) scale(0.8);
        opacity: 0;
      }
      50% {
        opacity: 0.9;
      }
      100% {
        transform: translateY(-10vh) rotate(-45deg) scale(1.3);
        opacity: 0;
      }
    }

    /* Enhanced Glassmorphism Card Container */
    .card-container {
      background: rgba(43, 20, 68, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 40px 30px;
      border-radius: 24px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 90%;
      width: 420px;
      position: relative;
      z-index: 10;
    }

    /* First Page (Quote Screen) */
    #page1 h1 {
      color: #ffffff;
      font-size: 1.8rem;
      font-style: italic;
      margin-bottom: 30px;
      line-height: 1.4;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    /* Second Page (Proposal Screen) */
    #page2 {
      display: none;
    }

    #page2 h1 {
      color: #ffffff;
      font-size: 1.9rem;
      margin-top: 0;
      margin-bottom: 25px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    button {
      padding: 14px 28px;
      font-size: 1.15rem;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .primary-btn {
      background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
    }

    .primary-btn:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.6);
    }

    .secondary-btn {
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4);
    }

    .secondary-btn:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 6px 20px rgba(244, 63, 94, 0.6);
    }

    #responseMessage {
      font-size: 1.6rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      display: none;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <!-- PAGE 1: Quote Screen -->
    <div id="page1">
      <h1>"Would you like to listen to me once?" 💭✨</h1>
      <button id="listenBtn" class="primary-btn">Yes, I'm listening ❤️</button>
    </div>

    <!-- PAGE 2: Proposal Screen -->
    <div id="page2">
      <h1 id="question">Would you like to go on a cafe date with me? ☕✨</h1>

      <div class="btn-container" id="proposalBtns">
        <button id="yesBtn1" class="primary-btn">Yes, I'd love to!</button>
        <button id="yesBtn2" class="secondary-btn">Definitely! ☕</button>
      </div>

      <div id="responseMessage">Yay! Can't wait for our date! ☕❤️</div>
    </div>
  </div>

  <script>
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');
    const listenBtn = document.getElementById('listenBtn');
    
    const yesBtn1 = document.getElementById('yesBtn1');
    const yesBtn2 = document.getElementById('yesBtn2');
    const proposalBtns = document.getElementById('proposalBtns');
    const responseMessage = document.getElementById('responseMessage');
    const question = document.getElementById('question');

    // Page 1 to Page 2 Transition
    listenBtn.addEventListener('click', () => {
      page1.style.display = 'none';
      page2.style.display = 'block';
    });

    // Accept Action
    function acceptDate() {
      question.style.display = 'none';
      proposalBtns.style.display = 'none';
      responseMessage.style.display = 'block';
    }

    yesBtn1.addEventListener('click', acceptDate);
    yesBtn2.addEventListener('click', acceptDate);

    // Glowing Floating Hearts Generator
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = Math.random() * 2 + 3 + "s";
      
      const size = Math.random() * 8 + 6 + "px";
      heart.style.width = size;
      heart.style.height = size;

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }

    setInterval(createHeart, 250);
  </script>

</body>
</html>
