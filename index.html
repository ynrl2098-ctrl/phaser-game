<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Hexagonal Bubble Shooter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a; color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh; padding: 10px;
    }
    .game-container { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .ui-panel {
      display: flex; justify-content: space-between; align-items: center;
      width: 440px; background: #1e293b; padding: 12px 20px;
      border-radius: 10px; border: 2px solid #334155;
    }
    .ui-group { display: flex; flex-direction: column; align-items: center; }
    .ui-label { font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; }
    .ui-value { font-size: 1.25rem; font-weight: 700; color: #38bdf8; }
    .btn-restart {
      background: #3b82f6; color: #ffffff; border: none; padding: 8px 16px;
      font-size: 0.9rem; font-weight: 600; border-radius: 6px; cursor: pointer;
    }
    .btn-restart:hover { background: #2563eb; }
    canvas {
      background: #090d16; border: 3px solid #334155;
      border-radius: 12px; cursor: crosshair; display: block;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="ui-panel">
      <div class="ui-group">
        <span class="ui-label">Score</span>
        <span id="score" class="ui-value">0</span>
      </div>
      <div class="ui-group">
        <span class="ui-label">Fouls (Fouls/5)</span>
        <span id="misses" class="ui-value">0 / 5</span>
      </div>
      <button id="restartBtn" class="btn-restart">Restart</button>
    </div>
    <canvas id="gameCanvas" width="440" height="600"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const missesEl = document.getElementById("misses");
    const restartBtn = document.getElementById("restartBtn");

    const RADIUS = 22;
    const DIAMETER = RADIUS * 2;
    const ROW_HEIGHT = RADIUS * Math.sqrt(3);
    const COLS = 10;
    const ROWS = 9;
    const LAUNCHER_Y = 540; // Explicitly locked Y-coordinate inside canvas boundaries

    const BUBBLE_COLORS = [
      { name: 'red', fill: '#ef4444', stroke: '#b91c1c' },
      { name: 'green', fill: '#22c55e', stroke: '#15803d' },
      { name: 'blue', fill: '#3b82f6', stroke: '#1d4ed8' },
      { name: 'yellow', fill: '#eab308', stroke: '#a16207' },
      { name: 'purple', fill: '#a855f7', stroke: '#6b21a8' }
    ];

    let grid = [];
    let score = 0;
    let missCount = 0;
    let gameOver = false;
    let gameWon = false;
    let mousePos = { x: 220, y: 0 };

    let currentBubble = null;
    let nextBubble = null;
    let floatingAnimations = [];

    function getTileCenter(r, c) {
      const isOdd = r % 2 === 1;
      const xOffset = isOdd ? RADIUS * 2 : RADIUS;
      const x = xOffset + c * DIAMETER;
      const y = RADIUS + r * ROW_HEIGHT;
      return { x, y };
    }

    function getGridIndices(x, y) {
      let r = Math.round((y - RADIUS) / ROW_HEIGHT);
      r = Math.max(0, Math.min(ROWS - 1, r));
      const isOdd = r % 2 === 1;
      const xOffset = isOdd ? RADIUS * 2 : RADIUS;
      let c = Math.round((x - xOffset) / DIAMETER);
      const maxCols = isOdd ? COLS - 1 : COLS;
      c = Math.max(0, Math.min(maxCols - 1, c));
      return { r, c };
    }

    function getNeighbors(r, c) {
      const isOdd = r % 2 === 1;
      const offsets = isOdd 
        ? [ { r: 0, c: -1 }, { r: 0, c: 1 }, { r: -1, c: 0 }, { r: -1, c: 1 }, { r: 1, c: 0 }, { r: 1, c: 1 } ]
        : [ { r: 0, c: -1 }, { r: 0, c: 1 }, { r: -1, c: -1 }, { r: -1, c: 0 }, { r: 1, c: -1 }, { r: 1, c: 0 } ];

      let neighbors = [];
      offsets.forEach(off => {
        let nr = r + off.r;
        let nc = c + off.c;
        let maxCols = (nr % 2 === 1) ? COLS - 1 : COLS;
        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < maxCols) {
          neighbors.push({ r: nr, c: nc });
        }
      });
      return neighbors;
    }

    function getRandomColor() {
      return BUBBLE_COLORS[Math.floor(Math.random() * BUBBLE_COLORS.length)];
    }

    function createBubble(colorObj) {
      return {
        color: colorObj || getRandomColor(),
        x: 220,
        y: LAUNCHER_Y,
        dx: 0,
        dy: 0,
        moving: false
      };
    }

    function initGame() {
      grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
      for (let r = 0; r < 4; r++) {
        let maxCols = (r % 2 === 1) ? COLS - 1 : COLS;
        for (let c = 0; c < maxCols; c++) {
          grid[r][c] = getRandomColor();
        }
      }

      score = 0;
      missCount = 0;
      gameOver = false;
      gameWon = false;
      floatingAnimations = [];

      scoreEl.innerText = score;
      missesEl.innerText = `${missCount} / 5`;

      nextBubble = createBubble();
      spawnNextBubble();
    }

    function spawnNextBubble() {
      currentBubble = nextBubble;
      currentBubble.x = 220;
      currentBubble.y = LAUNCHER_Y;
      currentBubble.moving = false;
      nextBubble = createBubble();
    }

    canvas.addEventListener("mousemove", (e) => {
      const rect = canvas.getBoundingClientRect();
      mousePos.x = e.clientX - rect.left;
      mousePos.y = e.clientY - rect.top;
    });

    canvas.addEventListener("click", () => {
      if (gameOver || gameWon || !currentBubble || currentBubble.moving) return;

      let angle = Math.atan2(mousePos.y - currentBubble.y, mousePos.x - currentBubble.x);
      if (angle > -0.15) angle = -0.15;
      if (angle < -Math.PI + 0.15) angle = -Math.PI + 0.15;

      const SPEED = 14;
      currentBubble.dx = Math.cos(angle) * SPEED;
      currentBubble.dy = Math.sin(angle) * SPEED;
      currentBubble.moving = true;
    });

    restartBtn.addEventListener("click", initGame);

    function update() {
      if (gameOver || gameWon) return;

      for (let i = floatingAnimations.length - 1; i >= 0; i--) {
        let p = floatingAnimations[i];
        p.y += p.vy;
        p.vy += 0.5;
        p.alpha -= 0.02;
        if (p.alpha <= 0) floatingAnimations.splice(i, 1);
      }

      if (!currentBubble || !currentBubble.moving) return;

      currentBubble.x += currentBubble.dx;
      currentBubble.y += currentBubble.dy;

      if (currentBubble.x - RADIUS <= 0) {
        currentBubble.x = RADIUS;
        currentBubble.dx *= -1;
      } else if (currentBubble.x + RADIUS >= canvas.width) {
        currentBubble.x = canvas.width - RADIUS;
        currentBubble.dx *= -1;
      }

      if (currentBubble.y - RADIUS <= 0) {
        snapToGrid();
        return;
      }

      for (let r = 0; r < ROWS; r++) {
        let maxCols = (r % 2 === 1) ? COLS - 1 : COLS;
        for (let c = 0; c < maxCols; c++) {
          if (grid[r][c]) {
            let center = getTileCenter(r, c);
            let dist = Math.hypot(currentBubble.x - center.x, currentBubble.y - center.y);
            if (dist < DIAMETER - 2) {
              snapToGrid();
              return;
            }
          }
        }
      }
    }

    function snapToGrid() {
      let { r, c } = getGridIndices(currentBubble.x, currentBubble.y);

      if (grid[r][c]) {
        let emptyNeighbor = null;
        let minDist = Infinity;
        getNeighbors(r, c).forEach(n => {
          if (!grid[n.r][n.c]) {
            let center = getTileCenter(n.r, n.c);
            let d = Math.hypot(currentBubble.x - center.x, currentBubble.y - center.y);
            if (d < minDist) {
              minDist = d;
              emptyNeighbor = n;
            }
          }
        });

        if (emptyNeighbor) {
          r = emptyNeighbor.r;
          c = emptyNeighbor.c;
        }
      }

      grid[r][c] = currentBubble.color;
      currentBubble.moving = false;

      let matchedCluster = getMatchedCluster(r, c, currentBubble.color);

      if (matchedCluster.length >= 3) {
        matchedCluster.forEach(pos => {
          grid[pos.r][pos.c] = null;
        });
        score += matchedCluster.length * 10;
        dropUnconnectedBubbles();

        if (isBoardCleared()) {
          gameWon = true;
          scoreEl.innerText = score;
          return;
        }
      } else {
        missCount++;
        missesEl.innerText = `${missCount} / 5`;

        if (missCount >= 5) {
          shiftGridDown();
          missCount = 0;
          missesEl.innerText = `0 / 5`;
        }
      }

      checkGameOver();

      if (!gameOver && !gameWon) {
        spawnNextBubble();
      }
    }

    function getMatchedCluster(startR, startC, targetColor) {
      let matches = [];
      let visited = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
      let queue = [{ r: startR, c: startC }];
      visited[startR][startC] = true;

      while (queue.length > 0) {
        let { r, c } = queue.shift();
        matches.push({ r, c });

        getNeighbors(r, c).forEach(n => {
          if (!visited[n.r][n.c] && grid[n.r][n.c] && grid[n.r][n.c].name === targetColor.name) {
            visited[n.r][n.c] = true;
            queue.push(n);
          }
        });
      }
      return matches;
    }

    function dropUnconnectedBubbles() {
      let connectedToTop = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
      let queue = [];

      for (let c = 0; c < COLS; c++) {
        if (grid[0][c]) {
          connectedToTop[0][c] = true;
          queue.push({ r: 0, c });
        }
      }

      while (queue.length > 0) {
        let { r, c } = queue.shift();

        getNeighbors(r, c).forEach(n => {
          if (!connectedToTop[n.r][n.c] && grid[n.r][n.c]) {
            connectedToTop[n.r][n.c] = true;
            queue.push(n);
          }
        });
      }

      let droppedCount = 0;
      for (let r = 0; r < ROWS; r++) {
        let maxCols = (r % 2 === 1) ? COLS - 1 : COLS;
        for (let c = 0; c < maxCols; c++) {
          if (grid[r][c] && !connectedToTop[r][c]) {
            let center = getTileCenter(r, c);
            floatingAnimations.push({
              x: center.x,
              y: center.y,
              vy: 2,
              alpha: 1.0,
              color: grid[r][c]
            });

            grid[r][c] = null;
            droppedCount++;
          }
        }
      }

      if (droppedCount > 0) {
        score += droppedCount * 20;
      }
      scoreEl.innerText = score;
    }

    function shiftGridDown() {
      for (let r = ROWS - 1; r > 0; r--) {
        grid[r] = [...grid[r - 1]];
      }

      grid[0] = [];
      for (let c = 0; c < COLS; c++) {
        grid[0][c] = getRandomColor();
      }
    }

    function isBoardCleared() {
      return grid.every(row => row.every(cell => cell === null));
    }

    function checkGameOver() {
      for (let r = ROWS - 2; r < ROWS; r++) {
        let maxCols = (r % 2 === 1) ? COLS - 1 : COLS;
        for (let c = 0; c < maxCols; c++) {
          if (grid[r][c] !== null) {
            gameOver = true;
            return;
          }
        }
      }
    }

    function drawBubble(x, y, colorObj, opacity = 1.0) {
      ctx.save();
      ctx.globalAlpha = opacity;
      
      ctx.beginPath();
      ctx.arc(x, y, RADIUS - 1, 0, Math.PI * 2);
      ctx.fillStyle = colorObj.fill;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = colorObj.stroke;
      ctx.stroke();

      let highlight = ctx.createRadialGradient(
        x - RADIUS / 3, y - RADIUS / 3, 1,
        x - RADIUS / 3, y - RADIUS / 3, RADIUS / 1.5
      );
      highlight.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
      highlight.addColorStop(1, 'rgba(255, 255, 255, 0)');

      ctx.beginPath();
      ctx.arc(x, y, RADIUS - 1, 0, Math.PI * 2);
      ctx.fillStyle = highlight;
      ctx.fill();

      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Grid
      for (let r = 0; r < ROWS; r++) {
        let maxCols = (r % 2 === 1) ? COLS - 1 : COLS;
        for (let c = 0; c < maxCols; c++) {
          if (grid[r][c]) {
            let center = getTileCenter(r, c);
            drawBubble(center.x, center.y, grid[r][c]);
          }
        }
      }

      // Dropping animations
      floatingAnimations.forEach(p => {
        drawBubble(p.x, p.y, p.color, p.alpha);
      });

      if (!gameOver && !gameWon) {
        // Trajectory line
        if (currentBubble && !currentBubble.moving) {
          ctx.beginPath();
          ctx.moveTo(currentBubble.x, currentBubble.y);
          ctx.lineTo(mousePos.x, mousePos.y);
          ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 6]);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // NEXT bubble indicator
        ctx.fillStyle = "#94a3b8";
        ctx.font = "12px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("NEXT", 50, LAUNCHER_Y - 30);
        if (nextBubble) {
          drawBubble(50, LAUNCHER_Y, nextBubble.color);
        }

        // ACTIVE SHOOTER BALL (Always renders at 220, 540)
        if (currentBubble) {
          drawBubble(currentBubble.x, currentBubble.y, currentBubble.color);
        }
      }

      // Game Over / Victory
      if (gameOver || gameWon) {
        ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.textAlign = "center";
        if (gameWon) {
          ctx.fillStyle = "#38bdf8";
          ctx.font = "bold 36px sans-serif";
          ctx.fillText("VICTORY!", canvas.width / 2, canvas.height / 2 - 20);
        } else {
          ctx.fillStyle = "#ef4444";
          ctx.font = "bold 36px sans-serif";
          ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
        }

        ctx.fillStyle = "#f8fafc";
        ctx.font = "18px sans-serif";
        ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    initGame();
    gameLoop();
  </script>
</body>
</html>
