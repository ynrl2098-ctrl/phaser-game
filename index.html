<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Note for You...</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
      position: relative;
    }

    /* Animated Glowing Hearts */
    .heart {
      position: absolute;
      background-color: #ffd1dc;
      display: inline-block;
      width: 12px;
      height: 12px;
      transform: rotate(-45deg);
      opacity: 0.8;
      box-shadow: 0 0 8px rgba(255, 209, 220, 0.8);
      animation: floatUp 4s linear infinite;
      pointer-events: none;
      z-index: 1;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      background-color: #ffd1dc;
      border-radius: 50%;
    }

    .heart::before {
      top: -6px;
      left: 0;
    }

    .heart::after {
      top: 0;
      left: 6px;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) rotate(-45deg) scale(0.8);
        opacity: 0;
      }
      50% {
        opacity: 0.9;
      }
      100% {
        transform: translateY(-10vh) rotate(-45deg) scale(1.3);
        opacity: 0;
      }
    }

    /* Frosted Glass Card Container */
    .card-container {
      background: rgba(43, 20, 68, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 40px 30px;
      border-radius: 24px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 90%;
      width: 440px;
      position: relative;
      z-index: 10;
    }

    /* Page Styling */
    h1 {
      color: #ffffff;
      font-size: 1.7rem;
      margin-top: 0;
      margin-bottom: 25px;
      line-height: 1.5;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    p.subtext {
      color: #f3e8ff;
      font-size: 1.1rem;
      font-style: italic;
      margin-top: -10px;
      margin-bottom: 25px;
    }

    #page2 {
      display: none;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    button {
      padding: 14px 32px;
      font-size: 1.15rem;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
    }

    button:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.6);
    }

    #responseMessage {
      font-size: 1.5rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      display: none;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <!-- PAGE 1: Silence Quote & Single Warm Button -->
    <div id="page1">
      <h1>"I know we aren't talking right now, but the silence feels a bit too quiet without you." 💭✨</h1>
      <p class="subtext">Would you like to hear what's on my mind?</p>
      <div class="btn-container">
        <button id="listenBtn">I'm listening, tell me ❤️</button>
      </div>
    </div>

    <!-- PAGE 2: Cafe Proposal & Single Positive Button -->
    <div id="page2">
      <h1 id="question">Let's break the silence over coffee... can I take you out on a cafe date? ☕✨</h1>

      <div class="btn-container" id="proposalBtns">
        <button id="acceptBtn">I'd love that, let's go ☕✨</button>
      </div>

      <div id="responseMessage">
        I can't wait to see you! <br> Pick a time and I'm there. ☕❤️
      </div>
    </div>
  </div>

  <script>
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');
    const listenBtn = document.getElementById('listenBtn');
    
    const acceptBtn = document.getElementById('acceptBtn');
    const proposalBtns = document.getElementById('proposalBtns');
    const responseMessage = document.getElementById('responseMessage');
    const question = document.getElementById('question');

    // Transition from Page 1 to Page 2
    listenBtn.addEventListener('click', () => {
      page1.style.display = 'none';
      page2.style.display = 'block';
    });

    // Accept Action on Page 2
    acceptBtn.addEventListener('click', () => {
      question.style.display = 'none';
      proposalBtns.style.display = 'none';
      responseMessage.style.display = 'block';
    });

    // Glowing Floating Hearts Script
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = Math.random() * 2 + 3 + "s";
      
      const size = Math.random() * 8 + 6 + "px";
      heart.style.width = size;
      heart.style.height = size;

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }

    setInterval(createHeart, 250);
  </script>

</body>
</html>
