<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 3D Cockpit Racing Simulator</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
    }

    /* F1 Broadcast Leaderboard (Top Left) */
    .leaderboard {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(15, 15, 20, 0.85);
      border-left: 4px solid #e10600;
      padding: 10px 14px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      border-radius: 4px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .driver-row {
      display: flex;
      justify-content: space-between;
      width: 170px;
      margin: 4px 0;
      padding: 2px 4px;
    }
    .driver-row.player { background: rgba(225, 6, 0, 0.3); border-radius: 2px; }

    /* F1 Telemetry HUD (Bottom Right) */
    .telemetry {
      position: absolute;
      bottom: 30px;
      right: 30px;
      background: rgba(10, 10, 15, 0.9);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 15px 25px;
      border-radius: 8px;
      color: #fff;
      text-align: right;
      box-shadow: 0 8px 25px rgba(0,0,0,0.7);
    }
    .gear { font-size: 38px; color: #facc15; font-weight: 900; }
    .speed { font-size: 28px; font-weight: 800; color: #fff; }
    .speed-unit { font-size: 12px; color: #888; }
    .rpm-bar { width: 140px; height: 6px; background: #222; margin-top: 8px; border-radius: 3px; overflow: hidden; }
    .rpm-fill { width: 70%; height: 100%; background: linear-gradient(90deg, #22c55e, #facc15, #ef4444); }

    /* Track Minimap (Bottom Left) */
    #minimap {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0,0,0,0.6);
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
    }
  </style>
  <!-- Three.js 3D Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="game-container"></div>

  <!-- F1 HUD Overlay -->
  <div class="leaderboard">
    <div style="color:#aaa; font-size:10px; margin-bottom:5px;">POS &nbsp; DRIVER</div>
    <div class="driver-row"><span>1 HAMILTON</span> <span style="color:#22c55e;">LEADER</span></div>
    <div class="driver-row"><span>2 VERSTAPPEN</span> <span style="color:#888;">+0.421</span></div>
    <div class="driver-row player"><span>3 YOU (F1)</span> <span style="color:#facc15;">INTERVAL</span></div>
    <div class="driver-row"><span>4 NORRIS</span> <span style="color:#888;">+1.205</span></div>
    <div class="driver-row"><span>5 LECLERC</span> <span style="color:#888;">+1.890</span></div>
  </div>

  <div class="telemetry">
    <div class="gear" id="gearDisplay">4</div>
    <div class="speed"><span id="speedDisplay">184</span> <span class="speed-unit">KM/H</span></div>
    <div class="rpm-bar"><div class="rpm-fill" id="rpmDisplay"></div></div>
  </div>

  <canvas id="minimap" width="120" height="120"></canvas>

  <script>
    // --- 3D SCENE SETUP ---
    const container = document.getElementById('game-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // Realistic Sky
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.003);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // --- LIGHTING ---
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
    sunLight.position.set(100, 200, 50);
    sunLight.castShadow = true;
    scene.add(sunLight);
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));

    // --- TRACK ENVIRONMENT ---
    const trackWidth = 24;
    const roadGeometry = new THREE.PlaneGeometry(trackWidth, 2000);
    const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
    const road = new THREE.Mesh(roadGeometry, roadMaterial);
    road.rotation.x = -Math.PI / 2;
    road.receiveShadow = true;
    scene.add(road);

    // Grass Terrain
    const grassGeo = new THREE.PlaneGeometry(1000, 2000);
    const grassMat = new THREE.MeshStandardMaterial({ color: 0x15803d });
    const grass = new THREE.Mesh(grassGeo, grassMat);
    grass.rotation.x = -Math.PI / 2;
    grass.position.y = -0.1;
    scene.add(grass);

    // Red & White Curbs & Sponsor Barriers
    for (let z = -1000; z < 1000; z += 20) {
      const curbMat = new THREE.MeshBasicMaterial({ color: (Math.floor(z / 20) % 2 === 0) ? 0xef4444 : 0xffffff });
      
      const leftCurb = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.4, 20), curbMat);
      leftCurb.position.set(-trackWidth/2 - 0.75, 0.1, z);
      scene.add(leftCurb);

      const rightCurb = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.4, 20), curbMat);
      rightCurb.position.set(trackWidth/2 + 0.75, 0.1, z);
      scene.add(rightCurb);
    }

    // Grandstands (Crowd Barriers)
    const standGeo = new THREE.BoxGeometry(10, 15, 800);
    const standMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
    const leftStand = new THREE.Mesh(standGeo, standMat);
    leftStand.position.set(-35, 7.5, 0);
    const rightStand = new THREE.Mesh(standGeo, standMat);
    rightStand.position.set(35, 7.5, 0);
    scene.add(leftStand, rightStand);

    // --- COCKPIT & HALO CREATION ---
    const cockpitGroup = new THREE.Group();
    
    // Halo Security Frame (Central Pillar + Curve)
    const haloMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2, metalness: 0.8 });
    
    // Center Strut
    const centerStrut = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.2), haloMat);
    centerStrut.position.set(0, 0.2, -0.8);
    cockpitGroup.add(centerStrut);

    // Halo Upper Arch
    const haloArch = new THREE.Mesh(new THREE.TorusGeometry(0.7, 0.05, 8, 24, Math.PI), haloMat);
    haloArch.rotation.x = Math.PI / 2;
    haloArch.position.set(0, 0.7, -0.8);
    cockpitGroup.add(haloArch);

    // Front Tires Viewable from Cockpit
    const tireMat = new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.9 });
    const tireGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.5, 24);
    
    const frontLeftTire = new THREE.Mesh(tireGeo, tireMat);
    frontLeftTire.rotation.z = Math.PI / 2;
    frontLeftTire.position.set(-1.8, -0.2, -2.2);
    cockpitGroup.add(frontLeftTire);

    const frontRightTire = frontLeftTire.clone();
    frontRightTire.position.x = 1.8;
    cockpitGroup.add(frontRightTire);

    scene.add(cockpitGroup);

    // Position Camera inside Cockpit
    camera.position.set(0, 1.1, 0);
    cockpitGroup.position.copy(camera.position);

    // --- AI RIVAL CARS ---
    const rivalCars = [];
    const carColors = [0xdc2626, 0x0284c7, 0xeab308, 0x16a34a];

    for (let i = 0; i < 4; i++) {
      const carMat = new THREE.MeshStandardMaterial({ color: carColors[i] });
      const carBody = new THREE.Mesh(new THREE.BoxGeometry(2, 0.8, 4.5), carMat);
      carBody.position.set((Math.random() - 0.5) * 16, 0.4, -50 - (i * 40));
      carBody.castShadow = true;
      scene.add(carBody);
      rivalCars.push(carBody);
    }

    // --- GAME LOGIC & CONTROLS ---
    let playerX = 0;
    let currentSpeed = 140;
    const keys = {};

    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    // --- MINIMAP RENDERING ---
    const minimapCanvas = document.getElementById('minimap');
    const miniCtx = minimapCanvas.getContext('2d');

    function drawMinimap() {
      miniCtx.clearRect(0, 0, 120, 120);
      miniCtx.strokeStyle = '#666';
      miniCtx.lineWidth = 12;
      miniCtx.beginPath();
      miniCtx.arc(60, 60, 45, 0, Math.PI * 2);
      miniCtx.stroke();

      // Player Blip (Red)
      miniCtx.fillStyle = '#ef4444';
      miniCtx.beginPath();
      miniCtx.arc(60 + (playerX * 1.5), 95, 5, 0, Math.PI * 2);
      miniCtx.fill();
    }

    // --- MAIN ANIMATION LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      // Handle Steering Controls
      if ((keys['ArrowLeft'] || keys['a']) && playerX > -trackWidth/2 + 2) {
        playerX -= 0.25;
        camera.rotation.z = 0.03; // Dynamic G-Force Camera Tilt
      } else if ((keys['ArrowRight'] || keys['d']) && playerX < trackWidth/2 - 2) {
        playerX += 0.25;
        camera.rotation.z = -0.03;
      } else {
        camera.rotation.z = 0;
      }

      // Acceleration & Braking Controls
      if (keys['ArrowUp'] || keys['w']) currentSpeed = Math.min(currentSpeed + 0.8, 320);
      else if (keys['ArrowDown'] || keys['s']) currentSpeed = Math.max(currentSpeed - 1.5, 60);

      // Lock Camera & Cockpit Together
      camera.position.x = playerX;
      cockpitGroup.position.x = playerX;
      cockpitGroup.position.z = camera.position.z;

      // Animate AI Rivals
      rivalCars.forEach((car, index) => {
        car.position.z += (currentSpeed * 0.005) - (0.4 + index * 0.1);
        
        // Loop traffic endlessly
        if (car.position.z > camera.position.z + 10) {
          car.position.z = camera.position.z - 250 - Math.random() * 50;
          car.position.x = (Math.random() - 0.5) * (trackWidth - 4);
        }
      });

      // Update Telemetry Display
      document.getElementById('speedDisplay').innerText = Math.floor(currentSpeed);
      document.getElementById('gearDisplay').innerText = Math.min(Math.floor(currentSpeed / 40) + 1, 8);
      document.getElementById('rpmDisplay').style.width = ((currentSpeed % 40) / 40 * 100) + '%';

      drawMinimap();
      renderer.render(scene, camera);
    }

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
