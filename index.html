<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Car Parking Simulator</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
    }

    /* HUD Elements */
    .hud {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 20px;
      border-radius: 8px;
      color: #fff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .hud h2 { margin: 0 0 5px 0; font-size: 18px; color: #38bdf8; }
    .status { font-weight: bold; color: #facc15; font-size: 14px; }

    .controls-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 18px;
      border-radius: 8px;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.6;
    }
    .controls-panel b { color: #fff; }

    /* Victory / Game Over Overlay */
    #message-box {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #38bdf8;
      padding: 30px 50px;
      border-radius: 12px;
      text-align: center;
      color: #fff;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
    }
    #message-box h1 { margin: 0 0 10px 0; font-size: 32px; }
    #message-box p { margin: 0 0 20px 0; color: #94a3b8; }
    #message-box button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 10px 24px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="game-container"></div>

  <div class="hud">
    <h2>PARKING CHALLENGE</h2>
    <div class="status" id="status-text">Park inside the glowing spot!</div>
  </div>

  <div class="controls-panel">
    <b>CONTROLS:</b><br>
    W / Up Arrow: Accelerate<br>
    S / Down Arrow: Reverse / Brake<br>
    A / D / Left / Right: Turn Wheels
  </div>

  <div id="message-box">
    <h1 id="msg-title">PARKED PERFECTLY!</h1>
    <p id="msg-desc">You successfully completed the parking maneuver.</p>
    <button onclick="location.reload()">PLAY AGAIN</button>
  </div>

  <script>
    // --- SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);
    scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('game-container').appendChild(renderer.domElement);

    // --- LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
    sunLight.position.set(40, 60, 20);
    sunLight.castShadow = true;
    scene.add(sunLight);

    // --- ENVIRONMENT & PARKING LOT ---
    const lotSize = 100;
    const groundGeo = new THREE.PlaneGeometry(lotSize, lotSize);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Perimeter Barriers
    const obstacles = [];
    const barrierMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.5 });
    
    function createWall(x, z, w, d) {
      const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 2, d), barrierMat);
      wall.position.set(x, 1, z);
      wall.castShadow = true;
      wall.receiveShadow = true;
      scene.add(wall);
      obstacles.push(new THREE.Box3().setFromObject(wall));
    }

    // Border Walls
    createWall(0, -lotSize/2, lotSize, 2);
    createWall(0, lotSize/2, lotSize, 2);
    createWall(-lotSize/2, 0, 2, lotSize);
    createWall(lotSize/2, 0, 2, lotSize);

    // Parked Traffic Cars (Obstacles)
    function createParkedCar(x, z, rotY) {
      const group = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(2.2, 1.2, 4.4),
        new THREE.MeshStandardMaterial({ color: Math.random() > 0.5 ? 0x64748b : 0x0284c7 })
      );
      body.position.y = 0.8;
      body.castShadow = true;
      group.add(body);
      group.position.set(x, 0, z);
      group.rotation.y = rotY;
      scene.add(group);
      
      obstacles.push(new THREE.Box3().setFromObject(body));
    }

    // Row of parked cars
    createParkedCar(-15, -10, 0);
    createParkedCar(-10, -10, 0);
    createParkedCar(10, -10, 0);
    createParkedCar(15, -10, 0);

    // --- TARGET PARKING BAY ---
    const targetX = 0, targetZ = -10;
    const targetSize = { w: 3.5, d: 5.5 };

    // Glowing Target Spot
    const targetGeo = new THREE.PlaneGeometry(targetSize.w, targetSize.d);
    const targetMat = new THREE.MeshBasicMaterial({ color: 0x22c55e, side: THREE.DoubleSide, transparent: true, opacity: 0.4 });
    const targetMesh = new THREE.Mesh(targetGeo, targetMat);
    targetMesh.rotation.x = -Math.PI / 2;
    targetMesh.position.set(targetX, 0.05, targetZ);
    scene.add(targetMesh);

    // Yellow Parking Bay Lines
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
    const leftLine = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 6), lineMat);
    leftLine.rotation.x = -Math.PI / 2;
    leftLine.position.set(targetX - 2, 0.06, targetZ);
    const rightLine = leftLine.clone();
    rightLine.position.x = targetX + 2;
    scene.add(leftLine, rightLine);

    // --- PLAYER CAR ---
    const carGroup = new THREE.Group();
    const carWidth = 2.2, carHeight = 1.2, carLength = 4.4;

    const carBody = new THREE.Mesh(
      new THREE.BoxGeometry(carWidth, carHeight, carLength),
      new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.2, metalness: 0.3 })
    );
    carBody.position.y = 0.8;
    carBody.castShadow = true;
    carGroup.add(carBody);

    // Cabin Glass
    const cabin = new THREE.Mesh(
      new THREE.BoxGeometry(1.8, 0.7, 2.2),
      new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1 })
    );
    cabin.position.set(0, 1.4, -0.2);
    carGroup.add(cabin);

    carGroup.position.set(0, 0, 20);
    scene.add(carGroup);

    // --- VEHICLE CONTROLS & PHYSICS ---
    let speed = 0;
    let maxSpeed = 0.4;
    let accel = 0.012;
    let friction = 0.95;
    let turnAngle = 0;
    let carAngle = 0;
    let isGameOver = false;

    const keys = {};
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    // Collision Detection Box
    const carBBox = new THREE.Box3();

    function checkWin() {
      const dist = Math.hypot(carGroup.position.x - targetX, carGroup.position.z - targetZ);
      const angleDiff = Math.abs((carAngle % Math.PI));

      // Check if stopped inside the box aligned properly
      if (dist < 1.2 && Math.abs(speed) < 0.02 && (angleDiff < 0.3 || Math.abs(angleDiff - Math.PI) < 0.3)) {
        isGameOver = true;
        document.getElementById('message-box').style.display = 'block';
      }
    }

    // --- GAME LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      if (!isGameOver) {
        // Accelerate & Reverse
        if (keys['w'] || keys['arrowup']) speed = Math.min(speed + accel, maxSpeed);
        if (keys['s'] || keys['arrowdown']) speed = Math.max(speed - accel, -maxSpeed * 0.5);

        speed *= friction;

        // Steering Physics
        if (Math.abs(speed) > 0.005) {
          const dir = speed > 0 ? 1 : -1;
          if (keys['a'] || keys['arrowleft']) carAngle += 0.03 * dir;
          if (keys['d'] || keys['arrowright']) carAngle -= 0.03 * dir;
        }

        carGroup.rotation.y = carAngle;
        carGroup.position.x += Math.sin(carAngle) * speed;
        carGroup.position.z += Math.cos(carAngle) * speed;

        // Update Collision Bounding Box
        carBBox.setFromObject(carGroup);

        // Check Wall/Traffic Collisions
        for (let obs of obstacles) {
          if (carBBox.intersectsBox(obs)) {
            speed = -speed * 0.5; // Bounce back
            document.getElementById('status-text').innerText = "CRASH! Adjust your maneuver!";
            document.getElementById('status-text').style.color = "#ef4444";
          }
        }

        checkWin();
      }

      // Smooth Third-Person Camera Follow
      const camOffset = new THREE.Vector3(0, 6, -12).applyAxisAngle(new THREE.Vector3(0, 1, 0), carAngle);
      camera.position.copy(carGroup.position).add(camOffset);
      camera.lookAt(carGroup.position.clone().add(new THREE.Vector3(0, 1, 0)));

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
